<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="800"
  height="400"
  viewBox="0 0 800 400"
  xmlns="http://www.w3.org/2000/svg"
  preserveAspectRatio="xMidYMid slice"
>
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGradient)" />

  <!-- Bars -->
  <rect x="120" y="180" width="60" height="180" fill="#2563EB" rx="6" />
  <rect x="260" y="140" width="60" height="220" fill="#3B82F6" rx="6" />
  <rect x="400" y="100" width="60" height="260" fill="#60A5FA" rx="6" />
  <rect x="540" y="220" width="60" height="140" fill="#93C5FD" rx="6" />

  <!-- Line chart path -->
  <polyline
    points="150,260 290,220 430,180 570,300"
    fill="none"
    stroke="#1E3A8A"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Data points -->
  <circle cx="150" cy="260" r="6" fill="#1E3A8A" />
  <circle cx="290" cy="220" r="6" fill="#1E3A8A" />
  <circle cx="430" cy="180" r="6" fill="#1E3A8A" />
  <circle cx="570" cy="300" r="6" fill="#1E3A8A" />

  <!-- Axis labels -->
  <text x="150" y="380" fill="#475569" font-size="14" text-anchor="middle">Q1</text>
  <text x="290" y="380" fill="#475569" font-size="14" text-anchor="middle">Q2</text>
  <text x="430" y="380" fill="#475569" font-size="14" text-anchor="middle">Q3</text>
  <text x="570" y="380" fill="#475569" font-size="14" text-anchor="middle">Q4</text>
</svg>
